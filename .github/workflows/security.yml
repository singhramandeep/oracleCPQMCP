name: Security

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Lint tool input schemas
        env:
          PYTHONPATH: mcp
        run: python scripts/lint_tool_schemas.py

      - name: Run tests
        env:
          PYTHONPATH: mcp
          CPQ_SCHEMA_INTEGRITY: "1"
        run: pytest tests/ -q -m "not live_eval"

      - name: Bandit security scan
        run: bandit -r mcp/oracle_cpq_mcp -ll -q

      - name: Dependency audit
        run: pip-audit
