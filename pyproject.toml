[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-cpq-mcp"
version = "0.1.0"
description = "MCP server for Oracle CPQ — Users, Groups, Data Tables, BML, Commerce, Parts, and Performance Logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
oracle-cpq-smoke = "utilities.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp/oracle_cpq_mcp", "utilities"]

[tool.hatch.build.targets.wheel.force-include]
"mcp/oracle_cpq_mcp" = "oracle_cpq_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mcp"]
markers = [
    "live_eval: hits a real CPQ sandbox (requires CPQ_LIVE_EVAL=1)",
]